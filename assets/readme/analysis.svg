<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="t d"><title id="t">Recorded group observations lead to calculation, verification and reproducible outputs.</title><desc id="d">Conceptual research artwork. No live prices, trades, returns or trading signals.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes swim{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,-4px)}}.swim{animation:swim 11s ease-in-out infinite}@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}.tail{animation:tail 4s ease-in-out infinite;transform-origin:100px 120px}@keyframes fin{0%,100%{opacity:.55}50%{opacity:1}}.fin{animation:fin 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.swim,.tail,.fin{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="247" height="285" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(41 29) scale(0.75)"><path d="M6 4h30v37H6zM13 12h16M13 20h16M13 28h12M13 35h7" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="85" y="56" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">OBSERVATIONS</text><text x="46" y="111" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Transcribed</text><text x="46" y="145" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">group counts in</text><text x="46" y="179" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">a small CSV</text><text x="46" y="213" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">file.</text><circle class="glow" style="animation-delay:-0.0s" cx="253" cy="37" r="3" fill="#A783F7"/><rect x="299" y="12" width="247" height="285" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(316 29) scale(0.75)"><path d="M14 4h16M18 4v15L7 35q-3 6 4 6h24q7 0 4-6L27 19V4M12 30h22" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="360" y="56" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">CALCULATION</text><text x="321" y="111" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Control</text><text x="321" y="145" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">correction and</text><text x="321" y="179" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">descriptive</text><text x="321" y="213" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">crossing</text><text x="321" y="247" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">calculation.</text><circle class="glow" style="animation-delay:-1.7s" cx="528" cy="37" r="3" fill="#A783F7"/><rect x="574" y="12" width="247" height="285" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(591 29) scale(0.75)"><path d="M5 6h33v33H5zM12 22l7 7 13-15" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="635" y="56" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">VERIFICATION</text><text x="596" y="111" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Regression</text><text x="596" y="145" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">checks and</text><text x="596" y="179" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">invalid-input</text><text x="596" y="213" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">tests.</text><circle class="glow" style="animation-delay:-3.4s" cx="803" cy="37" r="3" fill="#A783F7"/><rect x="849" y="12" width="247" height="285" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(866 29) scale(0.75)"><path d="M3 7h15q4 0 4 5q0-5 4-5h15v29H26q-4 0-4 5q0-5-4-5H3zM22 12v29" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="910" y="56" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">OUTPUTS</text><text x="871" y="111" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Reproducible</text><text x="871" y="145" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">JSON summary and</text><text x="871" y="179" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">mortality</text><text x="871" y="213" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">figure.</text><circle class="glow" style="animation-delay:-5.1s" cx="1078" cy="37" r="3" fill="#A783F7"/></svg>