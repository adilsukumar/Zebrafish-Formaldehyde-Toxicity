<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1140" viewBox="0 0 640 1140" role="img" aria-labelledby="t d"><title id="t">Keep the observation. Show the reasoning. A clear path back to the evidence. Concept fish illustration.</title><desc id="d">Conceptual research artwork. No live prices, trades, returns or trading signals.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes swim{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,-4px)}}.swim{animation:swim 11s ease-in-out infinite}@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}.tail{animation:tail 4s ease-in-out infinite;transform-origin:100px 120px}@keyframes fin{0%,100%{opacity:.55}50%{opacity:1}}.fin{animation:fin 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.swim,.tail,.fin{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M32 24H608" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="72" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">ZEBRAFISH / REPRODUCIBLE RESEARCH</text><text x="30" y="181" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="45" font-weight="700" text-anchor="start">Keep the observation.</text><text x="30" y="267" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="47" font-weight="700" text-anchor="start">Show the reasoning.</text><text x="32" y="356" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">A useful result leaves a clear path</text><text x="32" y="390" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">back to its evidence.</text><g transform="translate(39 532) scale(1.14)"><defs><clipPath id="fishclip"><path d="M100 120C175 49 344 47 462 114Q479 121 463 129C338 199 179 193 100 120Z"/></clipPath></defs><g class="swim"><g class="tail"><path d="M101 120L20 62Q39 119 19 179Z" fill="none" stroke="#A783F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M24 67L101 120L24 174" fill="none" stroke="#BCFCF6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g class="fin"><path d="M185 83L227 34L310 70" fill="none" stroke="#A783F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M195 161L234 207L277 176" fill="none" stroke="#A783F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M334 158L355 198L382 151" fill="none" stroke="#A783F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M100 120C175 49 344 47 462 114Q479 121 463 129C338 199 179 193 100 120Z" fill="#151C2C" stroke="#BCFCF6" stroke-width="3"/><g clip-path="url(#fishclip)"><path d="M102 92Q272 55 458 108" fill="none" stroke="#BCFCF6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M102 108Q272 77 458 116" fill="none" stroke="#A783F7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M102 124Q272 99 458 124" fill="none" stroke="#BCFCF6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M102 140Q272 121 458 132" fill="none" stroke="#A783F7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M102 156Q272 143 458 140" fill="none" stroke="#BCFCF6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M394 85Q365 123 394 157" fill="none" stroke="#BCFCF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 127L248 141L283 111" fill="none" stroke="#FF4081" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="430" cy="111" r="7" fill="#0E1116" stroke="#F3D962" stroke-width="2"/><path d="M457 122h13" fill="none" stroke="#BCFCF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="20" y="270" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">ADULT ZEBRAFISH / CONCEPT ILLUSTRATION</text></g><g transform="translate(32 984) scale(0.8636363636363636)"><path d="M6 4h30v37H6zM13 12h16M13 20h16M13 28h12M13 35h7" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(92 984) scale(0.8636363636363636)"><path d="M14 4h16M18 4v15L7 35q-3 6 4 6h24q7 0 4-6L27 19V4M12 30h22" fill="none" stroke="#F3D962" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(152 984) scale(0.8636363636363636)"><path d="M5 6h33v33H5zM12 22l7 7 13-15" fill="none" stroke="#BCFCF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="32" y="1095" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">DOCUMENTED BY ADIL SUKUMAR</text></svg>