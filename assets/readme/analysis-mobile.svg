<svg xmlns="http://www.w3.org/2000/svg" width="640" height="682" viewBox="0 0 640 682" role="img" aria-labelledby="t d"><title id="t">Recorded group observations lead to calculation, verification and reproducible outputs.</title><desc id="d">Conceptual research artwork. No live prices, trades, returns or trading signals.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes swim{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,-4px)}}.swim{animation:swim 11s ease-in-out infinite}@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}.tail{animation:tail 4s ease-in-out infinite;transform-origin:100px 120px}@keyframes fin{0%,100%{opacity:.55}50%{opacity:1}}.fin{animation:fin 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.swim,.tail,.fin{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="145" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(41 29) scale(0.75)"><path d="M6 4h30v37H6zM13 12h16M13 20h16M13 28h12M13 35h7" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="85" y="56" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">OBSERVATIONS</text><text x="46" y="111" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Transcribed group counts in a small CSV</text><text x="46" y="145" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">file.</text><circle class="glow" style="animation-delay:-0.0s" cx="598" cy="37" r="3" fill="#A783F7"/><rect x="24" y="176" width="592" height="145" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(41 193) scale(0.75)"><path d="M14 4h16M18 4v15L7 35q-3 6 4 6h24q7 0 4-6L27 19V4M12 30h22" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="85" y="220" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">CALCULATION</text><text x="46" y="275" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Control correction and descriptive</text><text x="46" y="309" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">crossing calculation.</text><circle class="glow" style="animation-delay:-1.7s" cx="598" cy="201" r="3" fill="#A783F7"/><rect x="24" y="340" width="592" height="145" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(41 357) scale(0.75)"><path d="M5 6h33v33H5zM12 22l7 7 13-15" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="85" y="384" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">VERIFICATION</text><text x="46" y="439" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Regression checks and invalid-input</text><text x="46" y="473" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">tests.</text><circle class="glow" style="animation-delay:-3.4s" cx="598" cy="365" r="3" fill="#A783F7"/><rect x="24" y="504" width="592" height="145" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(41 521) scale(0.75)"><path d="M3 7h15q4 0 4 5q0-5 4-5h15v29H26q-4 0-4 5q0-5-4-5H3zM22 12v29" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="85" y="548" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">OUTPUTS</text><text x="46" y="603" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Reproducible JSON summary and mortality</text><text x="46" y="637" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">figure.</text><circle class="glow" style="animation-delay:-5.1s" cx="598" cy="529" r="3" fill="#A783F7"/></svg>