<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="t d"><title id="t">QSAR reports provide chemical context. Original scope, interpretation limits and source provenance are retained.</title><desc id="d">Conceptual research artwork. No live prices, trades, returns or trading signals.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes swim{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,-4px)}}.swim{animation:swim 11s ease-in-out infinite}@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}.tail{animation:tail 4s ease-in-out infinite;transform-origin:100px 120px}@keyframes fin{0%,100%{opacity:.55}50%{opacity:1}}.fin{animation:fin 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.swim,.tail,.fin{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="1072" height="365" rx="14" fill="#151420" stroke="#363348"/><text x="48" y="62" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">KEEP THE EVIDENCE IN ITS SCOPE</text><g transform="translate(69 185) scale(1.05)"><path d="M44 100L115 63M156 63L224 100M137 33V-27M147 33V-27" fill="none" stroke="#BCFCF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="25" y="114" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="34" font-weight="600" text-anchor="start">H</text><text x="130" y="70" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="34" font-weight="600" text-anchor="start">C</text><text x="223" y="114" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="34" font-weight="600" text-anchor="start">H</text><text x="129" y="-39" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">O</text><circle class="glow" cx="142" cy="58" r="47" fill="none" stroke="#A783F7" stroke-width="1.4"/><text x="133" y="161" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">CHEMICAL CONTEXT</text></g><text x="455" y="117" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">SUPPORTING QSAR REPORTS</text><text x="455" y="167" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Toolbox records and chemical context</text><text x="455" y="201" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">remain separate from experimental</text><text x="455" y="235" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">inference.</text><text x="455" y="283" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">The original limitations and source</text><text x="455" y="317" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">provenance are retained below.</text></svg>