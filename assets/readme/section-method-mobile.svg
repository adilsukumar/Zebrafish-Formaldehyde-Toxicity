<svg xmlns="http://www.w3.org/2000/svg" width="640" height="217" viewBox="0 0 640 217" role="img" aria-labelledby="t d"><title id="t">METHOD, THEN INTERPRETATION. Correction, endpoint convention and explicit limitations.</title><desc id="d">Conceptual research artwork. No live prices, trades, returns or trading signals.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes swim{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,-4px)}}.swim{animation:swim 11s ease-in-out infinite}@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}.tail{animation:tail 4s ease-in-out infinite;transform-origin:100px 120px}@keyframes fin{0%,100%{opacity:.55}50%{opacity:1}}.fin{animation:fin 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.swim,.tail,.fin{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M28 12H612" fill="none" stroke="#363348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(30 40) scale(0.9090909090909091)"><path d="M14 4h16M18 4v15L7 35q-3 6 4 6h24q7 0 4-6L27 19V4M12 30h22" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="94" y="72" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">METHOD, THEN INTERPRETATION</text><text x="32" y="128" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Correction, endpoint convention and</text><text x="32" y="162" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">explicit limitations.</text><circle class="glow" cx="608" cy="197" r="4" fill="#F3D962"/></svg>