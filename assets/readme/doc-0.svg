<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" role="img" aria-labelledby="t d"><title id="t">Observations. Transcribed group counts</title><desc id="d">Conceptual research artwork. No live prices, trades, returns or trading signals.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes swim{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,-4px)}}.swim{animation:swim 11s ease-in-out infinite}@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}.tail{animation:tail 4s ease-in-out infinite;transform-origin:100px 120px}@keyframes fin{0%,100%{opacity:.55}50%{opacity:1}}.fin{animation:fin 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.swim,.tail,.fin{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="2" y="2" width="516" height="145" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(22 24) scale(0.8636363636363636)"><path d="M6 4h30v37H6zM13 12h16M13 20h16M13 28h12M13 35h7" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="78" y="51" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="600" text-anchor="start">Observations</text><text x="22" y="115" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Transcribed group counts</text></svg>